# Сборка редактора калибровок под Windows.
#
# Зачем CI, а не «собери у себя»: кросс-сборки у PyInstaller нет, exe для
# Windows собирается только на Windows. Сборочная машина здесь и есть та
# самая Windows.
#
# Готовый файл лежит во вкладке Actions -> нужный запуск -> Artifacts.
# Если поставить тег вида v1.0, он вдобавок прикрепится к релизу.

name: Сборка Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка релиза"
        default: "v1.0"
        required: false

jobs:
  build:
    runs-on: windows-latest

    # Без этого шаг с релизом падает с 403: по умолчанию токен сборки
    # умеет только читать, а релиз надо создать.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-editor.txt
          pip install pyinstaller

      # Проверки гоняем ДО сборки: собирать заведомо сломанное незачем.
      # offscreen -- потому что экрана на сборочной машине нет, а окно
      # создать надо.
      - name: Проверки
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          $fail = 0
          Get-ChildItem tests/test_*.py | ForEach-Object {
            Write-Host "=== $($_.Name) ==="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $fail = 1 }
          }
          if ($fail -ne 0) { throw "проверки провалены" }

      - name: Собрать
        env:
          PYTHONIOENCODING: utf-8
        run: pyinstaller --noconfirm editor.spec

      # Главный шаг. «Собралось» не значит «работает»: половина импортов
      # в проекте ленивая, и собранный файл спокойно откроется, а упадёт
      # при нажатии «протянуть». Самопроверка живёт внутри сборки и
      # прогоняет то же, что делается руками, -- правку, отмену,
      # сохранение с суммами, сравнение.
      #
      # Проверяем НЕ ТОЛЬКО код возврата. В первый раз шаг был зелёным, а
      # вывод пустым: кириллица не проходила в консоль, печать падала, и
      # проверить, что проверки вообще выполнились, было нечем. Теперь
      # самопроверка печатает итог латиницей, и сборка требует ровно эту
      # строку -- молчание больше не считается успехом.
      - name: Самопроверка собранного файла
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $out = & .\dist\selftest.exe --selftest firmware\FBH3ID60_stok.bin 2>&1
          $out | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 0) { throw "самопроверка сборки провалена" }
          if (-not ($out -match "SELFTEST RESULT: PASS")) {
            throw "самопроверка не подтвердила себя строкой SELFTEST RESULT: PASS"
          }

      # А это -- проверка ТОЙ САМОЙ сборки, которая уезжает человеку.
      # Консольный двойник собран из того же анализа, но отгружаем мы
      # папку, и проверять надо её. Она оконная, stdout нет, поэтому
      # самопроверка пишет в файл.
      - name: Самопроверка сборки-папки
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          # Start-Process -Wait, а не просто вызов: PowerShell не ждёт
          # ОКОННУЮ программу, управление возвращается сразу, и
          # $LASTEXITCODE берётся мимо -- первый прогон так и упал, хотя
          # сама самопроверка в логе писала PASS.
          $p = Start-Process -FilePath `
                 ".\dist\CalibrationEditor\CalibrationEditor.exe" `
               -ArgumentList "--selftest","firmware\FBH3ID60_stok.bin",`
                 "--log","selftest-dir.log" `
               -Wait -PassThru -NoNewWindow
          if (Test-Path selftest-dir.log) { Get-Content selftest-dir.log }
          if ($p.ExitCode -ne 0) {
            throw "самопроверка сборки-папки провалена, код $($p.ExitCode)"
          }
          if (-not (Select-String -Path selftest-dir.log `
                    -Pattern "SELFTEST RESULT: PASS" -Quiet)) {
            throw "сборка-папка не подтвердила себя"
          }

      - name: Упаковать папку
        run: Compress-Archive -Path dist\CalibrationEditor `
               -DestinationPath dist\CalibrationEditor-windows.zip

      - name: Выложить готовое
        uses: actions/upload-artifact@v4
        with:
          name: CalibrationEditor-windows
          path: |
            dist/CalibrationEditor-windows.zip
            dist/CalibrationEditor-onefile.exe
          if-no-files-found: error

      # Релиз делается и по тегу, и по ручному запуску.
      #
      # Ручной запуск здесь не прихоть: окружение, из которого идёт
      # разработка, пускает пуш только в рабочую ветку, и тег оттуда не
      # отправить. А без релиза .exe достаётся только через артефакты
      # Actions -- а те всегда завёрнуты в zip, требуют входа в GitHub и
      # протухают через 90 дней. Имя тега задано явно, action создаст его
      # сам на том коммите, с которого запущен.
      - name: Прикрепить к релизу
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || 'v1.0' }}
          name: Редактор калибровок ${{ inputs.tag || 'v1.0' }}
          files: |
            dist/CalibrationEditor-windows.zip
            dist/CalibrationEditor-onefile.exe
          body: |
            Редактор калибровок Bosch M7.9.7 (Kia Spectra 1.6, FBH3ID60).

            **Качай `CalibrationEditor-windows.zip`.** Распакуй куда
            угодно и запусти `CalibrationEditor.exe` из папки. Ставить
            ничего не нужно: ни Python, ни Qt. Описание карт вшито
            внутрь, остаётся открыть только прошивку.

            Второй файл, `CalibrationEditor-onefile.exe`, — то же самое
            одним файлом, без папки. Удобнее, но антивирусы такие
            самораспаковывающиеся сборки часто заворачивают по эвристике.
            Если zip-вариант устраивает, бери его.

            **Про предупреждения.** Файл не подписан сертификатом —
            сертификат платный. Поэтому Windows покажет «Система Windows
            защитила ваш компьютер»: «Подробнее» → «Выполнить в любом
            случае». Антивирус может поругаться по той же причине: код
            открытый, собирается публично на GitHub Actions, лог сборки
            виден целиком.

            Что умеет: дерево из 787 карт с русскими названиями и
            поиском, правка таблицы с операциями над выделением, отмена и
            повтор, кривая и поверхность, сравнение двух прошивок,
            сохранение с пересчётом контрольных сумм.

            Сборка проходит самопроверку внутри себя: правка, отмена с
            побайтовой сверкой, сохранение с суммами, сравнение.
